name: atompay_mobile
description: "AtomPay customer app: your limit, eligible products, orders and help for Atomshop.pk's pay-in-3-months option."
publish_to: 'none'

# Bump for every store build. /app-config.min_version is compared against the
# semver part (before the +).
version: 1.0.0+6

environment:
  sdk: ^3.13.4

dependencies:
  app_links: ^6.4.0
  cached_network_image: ^4.0.6
  camera: ^0.12.2
  connectivity_plus: ^7.3.1
  device_info_plus: ^13.2.0
  dio: ^5.11.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_image_compress: 2.5.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_tts: ^4.2.3
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  in_app_review: ^2.0.10
  intl: ^0.20.3
  json_annotation: ^4.12.0
  package_info_plus: ^10.2.1
  permission_handler: ^12.0.1
  pub_semver: ^2.2.1
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  speech_to_text: ^7.5.0
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Bundled so the first launch works offline. SIL OFL, see assets/fonts/OFL.txt.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
