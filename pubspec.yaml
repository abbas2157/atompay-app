name: atompay_mobile
description: "AtomPay customer app: purchase limit, KYC and instalment plans for AtomShop.pk."
publish_to: 'none'

# Bump for every store build. /app-config.min_version is compared against the
# semver part (before the +).
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  device_info_plus: ^13.2.0
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  image_picker: ^1.2.3
  intl: ^0.20.3
  json_annotation: ^4.12.0
  local_auth: ^3.0.2
  package_info_plus: ^10.2.1
  pub_semver: ^2.2.1
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true

  # Bundled so the first launch works offline (handbook §4.3). SIL OFL, see assets/fonts/OFL.txt.
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
