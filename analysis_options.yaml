include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/l10n/gen/**
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    # App code, not a published package.
    public_member_api_docs: false
    # Noisy on every Riverpod provider declaration; the provider constructor
    # already states the types.
    specify_nonobvious_property_types: false
