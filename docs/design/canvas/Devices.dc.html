<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signed-in devices</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./app.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:var(--primary)}a:hover{color:var(--primary-dark)}
.out{min-height:48px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--white);font-family:inherit;font-size:13px;font-weight:700;color:var(--rose);cursor:pointer}
</style>
</helmet>
<div class="scr" style="height: 844px">
  <div class="topw">
    <div class="safe"></div>
    <div class="appbar"><a href="Settings.dc.html" class="icon-btn" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a><span class="t">Signed-in devices</span></div>
  </div>
  <div class="content">
    <p class="small">Where your AtomPay account is signed in. Don't recognise one? Sign it out and change your password.</p>
    <div class="list">
      <sc-for list="{{rows}}" as="d" hint-placeholder-count="2">
        <div class="li">
          <span class="ico grey"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg></span>
          <span class="u-grow"><b>{{d.name}}</b><span class="d">{{d.when}}</span></span>
          <sc-if value="{{d.current}}" hint-placeholder-val="{{ false }}"><span class="badge b-green">This device</span></sc-if>
          <sc-if value="{{d.other}}" hint-placeholder-val="{{ true }}"><button class="out" onClick="{{d.drop}}" aria-label="Sign out {{d.name}}">Sign out</button></sc-if>
        </div>
      </sc-for>
    </div>
    <sc-if value="{{hasOthers}}" hint-placeholder-val="{{ true }}"><button class="btn btn-g btn-block" style="color: var(--rose)" onClick="{{dropAll}}">Sign out of all other devices</button></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // GET /auth/sessions; DELETE /auth/sessions/{id}. Device names are the
  // handbook's own format examples ("Pixel 7 · Android 14").
  constructor(props) { super(props); this.state = { gone: {} }; }
  renderVals() {
    const all = [['a', 'Pixel 7 · Android 14', 'Active now', true], ['b', 'iPhone 13 · iOS 18', 'Last used 2 Nov', false], ['c', 'Galaxy A26 · Android 15', 'Last used 28 Oct', false]];
    const gone = this.state.gone;
    const rows = all.filter((r) => !gone[r[0]]).map(([id, name, when, current]) => ({
      name, when, current, other: !current,
      drop: () => this.setState({ gone: { ...gone, [id]: true } }),
    }));
    return {
      rows, hasOthers: rows.some((r) => r.other),
      dropAll: () => this.setState({ gone: { b: true, c: true } }),
    };
  }
}
</script>
</body>
</html>
