<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CNIC front</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
.cam .icon-btn{color:var(--white)}.cam .icon-btn:hover{background:var(--ink-2);color:var(--white)}
</style>
</helmet>
<div class="scr cam" style="height: 844px">
  <div class="safe"></div>
  <div class="appbar">
    <a href="Verification.dc.html" class="icon-btn" aria-label="Close"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <span class="t" style="color: var(--white)">CNIC front</span>
  </div>
  <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 16px">
    <div style="width: 100%; aspect-ratio: 1.58; border-radius: 14px; background: var(--ink-2); display: grid; place-items: center; color: var(--on-dark-2); font-size: 13px; font-weight: 700; text-align: center; padding: 16px">Your uploaded photo<br>loads here from the server</div>
  </div>
  <div style="padding: 0 16px 34px; display: flex; flex-direction: column; gap: 12px; flex: none">
    <div style="display: flex; gap: 10px; align-items: flex-start; background: var(--ink-2); border-radius: 14px; padding: 12px 14px; font-size: 13px; font-weight: 600; color: var(--on-dark); line-height: 1.5">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--green-on-dark); flex: none; margin-top: 2px"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>
      <span>Uploaded 10 Nov. Shown from the server and never saved to this phone. Screenshots are blocked here.</span>
    </div>
    <a href="CaptureCnic.dc.html" class="btn btn-block" style="background: var(--white); color: var(--ink)">Replace this photo</a>
    <p class="tiny" style="text-align: center; color: var(--on-dark-2)">Replacing a document sends your identity for verification again.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // GET /profile/documents/{doc} with the bearer token; the bytes stay in
  // memory (handbook F9) and the window carries FLAG_SECURE.
  renderVals() { return {}; }
}
</script>
