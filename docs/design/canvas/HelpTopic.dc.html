<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Help · Buying</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./app.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:var(--primary)}a:hover{color:var(--primary-dark)}
.qa{border-top:1px solid var(--line)}
.qa:first-child{border-top:0}
.qa button{width:100%;min-height:56px;display:flex;align-items:center;gap:12px;padding:12px 16px;border:0;background:none;font:inherit;font-size:var(--fs-body);font-weight:700;color:var(--ink);text-align:left;cursor:pointer}
.qa button:active{background:var(--primary-soft)}
.qa button svg{margin-left:auto;flex:none;color:var(--glyph);transition:transform .15s}
.qa.open button svg{transform:rotate(180deg)}
.qa p{margin:0;padding:0 16px 16px;font-size:var(--fs-base);font-weight:500;color:var(--body);line-height:1.55}
@media (prefers-reduced-motion:reduce){.qa button svg{transition:none}}
</style>
</helmet>
<div class="scr" style="height: 900px">
  <div class="topw">
    <div class="safe"></div>
    <div class="appbar"><a href="HelpCentre.dc.html" class="icon-btn" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a><span class="t">Buying</span></div>
  </div>
  <div class="content u-gap14">
    <div class="field"><div class="input"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--muted)"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input aria-label="Search help" placeholder="Search help"></div></div>
    <div class="card" style="padding: 0; overflow: hidden">
      <sc-for list="{{items}}" as="q" hint-placeholder-count="4">
        <div class="qa {{q.cls}}">
          <button aria-expanded="{{q.open}}" onClick="{{q.toggle}}">{{q.q}}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
          <sc-if value="{{q.open}}" hint-placeholder-val="{{ false }}"><p>{{q.a}}</p></sc-if>
        </div>
      </sc-for>
    </div>
    <a href="AskAtom.dc.html" class="card" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; text-decoration: none; color: var(--ink); background: var(--apay-wash); border-color: var(--apay-line)">
      <span style="width: 44px; height: 44px; border-radius: 50%; background: var(--white); display: grid; place-items: center; flex: none"><img src="/_blob/8cf8a82d79c5f83aa330d31816673915" alt="" width="36" height="36" style="width: 36px; height: 36px; display: block"></span>
      <span class="u-grow"><b class="u-block u-fs-body">Still stuck? Ask Atom</b><span class="small u-body">It can see your limit and orders</span></span>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  // One screen for every topic, every question and search: Help's tiles and
  // questions open it at that topic, with the tapped question expanded.
  // Answers follow AtomPay's plan rules. The website's config('atompay.faqs')
  // still describes a down payment and a chosen term - fix that before the app
  // reuses it.
  constructor(props) { super(props); this.state = { open: 0 }; }
  renderVals() {
    const qs = [
      ['Do I buy directly in AtomPay?', 'No. You buy on Atomshop.pk and choose AtomPay at checkout. AtomPay is how you pay; it never sells anything itself.'],
      ['Is every product on Atomshop eligible?', 'No. Only products marked "AtomPay eligible" on their listing. The Shop tab shows the eligible ones that fit your limit.'],
      ['What decides my monthly payment?', 'The cash price, split into three equal months. The last month takes any rounding. No advance and 0% markup. Each month has to fit inside your monthly cap.'],
      ['What happens after I order?', 'Atomshop handles the order and delivery as usual. Your three payments and their dates then appear under Orders.'],
    ];
    return { items: qs.map(([q, a], i) => {
      const open = this.state.open === i;
      return { q, a, open, cls: open ? 'open' : '', toggle: () => this.setState({ open: open ? -1 : i }) };
    }) };
  }
}
</script>
</body>
</html>
