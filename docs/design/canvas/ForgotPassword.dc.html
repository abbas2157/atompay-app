<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reset your password</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./app.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:var(--primary)}a:hover{color:var(--primary-dark)}
</style>
</helmet>
<div class="scr white" style="height: 844px">
  <div class="safe"></div>
  <div class="appbar"><a href="SignIn.dc.html" class="icon-btn" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a></div>
  <div class="content" style="padding-top: 4px; gap: 22px">
    <div>
      <span class="eyebrow ap">Forgot password</span>
      <h1 class="h1 u-mt8">Reset your password</h1>
      <p class="lead u-mt8">Enter the email or mobile number on your AtomShop account.</p>
    </div>
    <div class="field"><label for="fp1">Email or mobile number</label><div class="input focus"><input id="fp1" value="0300 7013707"></div><span class="hint">Mobile numbers get the code on WhatsApp.</span></div>
    <a href="ForgotCode.dc.html" class="btn btn-p btn-lg btn-block">Send code</a>
    <div class="note blue"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span>This changes your AtomShop.pk password too — it is one account.</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // POST /auth/password/forgot always answers 202 for well-formed input, so the
  // next screen never reveals whether an account exists (handbook F12).
  renderVals() { return {}; }
}
</script>
</body>
</html>
