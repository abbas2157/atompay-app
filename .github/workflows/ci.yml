name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      # Golden images are pixel-exact per OS; they are checked by the
      # `goldens` job below against images generated on the same runner.
      - run: flutter test --exclude-tags golden

  # Brief §10: the merged release manifest must not declare a forbidden
  # permission (contacts, storage, location, phone, SMS, all packages).
  manifest-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter build apk --release --flavor prod --dart-define=FLAVOR=prod
      - run: dart run tool/check_manifest.dart

  goldens:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter test --tags golden
